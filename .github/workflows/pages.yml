name: Website veröffentlichen

# Hauptadresse = neuester Stand des Branches.
# Jede Version aus versions.txt (v1, v2, …) bleibt dauerhaft unter /v1/, /v2/, … erreichbar.

on:
  push:
    branches: [claude/apb-website-redesign-jmiwyv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/apb-website-redesign-jmiwyv
          fetch-depth: 0
      - name: Seite mit allen Versionen zusammenstellen
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          grep -v '^#' versions.txt | while read -r v sha rest; do
            [ -z "$v" ] && continue
            mkdir -p "_site/$v"
            git archive "$sha" | tar -x -C "_site/$v"
            rm -rf "_site/$v/.github" "_site/$v/tools"
            # Projektbilder nicht pro Version kopieren (GitHub-Pages-Limit 1 GB):
            # Versionen verwenden die Bilder der Hauptversion, die alle Dateien (JPG + WebP) enthält.
            rm -rf "_site/$v/assets/img/projects"
            grep -rlZ 'assets/img/projects/' "_site/$v" --include='*.html' --include='*.js' | xargs -0 -r sed -i 's#assets/img/projects/#../assets/img/projects/#g'

          done
          rm -rf _site/.github _site/versions.txt _site/tools _site/content
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
