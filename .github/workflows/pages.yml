name: Website veröffentlichen

# Hauptadresse = neuester Stand des Branches.
# Jede Version aus versions.txt (v1, v2, …) bleibt dauerhaft unter /v1/, /v2/, … erreichbar.

on:
  push:
    branches: [claude/apb-website-redesign-jmiwyv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # englische Übersetzungen aus dem CMS zurück ins Repository schreiben
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/apb-website-redesign-jmiwyv
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Die Seite wird hier neu gebaut, damit Änderungen aus dem CMS (assets/data/cms.json) ohne lokalen Build online gehen
      # Englisch für Inhalte aus dem CMS (DeepL, Schlüssel als Secret DEEPL_KEY). Ohne Schlüssel: bleibt Deutsch.
      - name: Englisch für CMS-Inhalte erzeugen
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: |
          out=$(python3 tools/cms_uebersetzen.py); echo "$out"
          if echo "$out" | grep -q '^geändert$'; then
            git config user.name "apb-website-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/cms.json
            git commit -m "CMS: englische Übersetzung automatisch erzeugt (bitte im CMS prüfen)"
            for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          fi
      - name: Website bauen (Projektdaten, Seiten, Englisch, SEO)
        env:
          APB_CI: '1'
          HOME_VARIANT: A
        run: |
          pip install --quiet numpy pillow beautifulsoup4
          python3 tools/projekte_einbauen.py > /dev/null
          python3 tools/build.py > /dev/null
          python3 tools/englisch.py
          python3 tools/seo.py
      - name: Seite mit allen Versionen zusammenstellen
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./_site -cf - . | tar -x -C _site
          grep -v '^#' versions.txt | while read -r v sha rest; do
            [ -z "$v" ] && continue
            mkdir -p "_site/$v"
            git archive "$sha" | tar -x -C "_site/$v"
            rm -rf "_site/$v/.github" "_site/$v/tools"
            # Projektbilder nicht pro Version kopieren (GitHub-Pages-Limit 1 GB):
            # Versionen verwenden die Bilder der Hauptversion, die alle Dateien (JPG + WebP) enthält.
            rm -rf "_site/$v/assets/img/projects" "_site/$v/assets/img/p2" "_site/$v/assets/video" "_site/$v/content" "_site/$v/assets/vendor/cesium" "_site/$v/assets/ref"
            grep -rlZ -e 'assets/img/p' -e 'assets/video/' -e 'assets/vendor/cesium/' -e 'assets/ref/' "_site/$v" --include='*.html' --include='*.js' | xargs -0 -r sed -i -e 's#assets/img/projects/#../assets/img/projects/#g' -e 's#assets/img/p2/#../assets/img/p2/#g' -e 's#assets/video/#../assets/video/#g' -e 's#assets/vendor/cesium/#../assets/vendor/cesium/#g' -e 's#assets/ref/#../assets/ref/#g'

          done
          rm -rf _site/.github _site/versions.txt _site/tools _site/content
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Eigener Job: GitHub braucht nach dem Hochladen einen Moment, bis das Paket gefunden wird
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
